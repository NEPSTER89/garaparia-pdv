<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV & Balcão - Emunáh Garaparia</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #1b3022; padding: 15px; color: #333; }
        
        .container { max-width: 550px; margin: 0 auto; background: #fdfbf7; padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #d4af37; }
        
        .logo-area { text-align: center; margin-bottom: 15px; }
        h1 { color: #1b3022; font-size: 22px; font-weight: 800; }
        .subtitle { color: #b8860b; font-size: 11px; margin-top: 2px; font-style: italic; font-weight: 600; }
        
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: #e8e2cd; padding: 4px; border-radius: 10px; border: 1.5px solid #d4af37; }
        .tab { flex: 1; padding: 9px 4px; text-align: center; cursor: pointer; font-weight: 700; color: #1b3022; background: transparent; border-radius: 8px; font-size: 12px; transition: all 0.3s ease; }
        .tab.active { background: #1b3022; color: #d4af37; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; color: #1b3022; font-size: 12px; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; border: 1.5px solid #d4af37; border-radius: 10px; font-size: 14px; background: #fff; color: #333; outline: none; }

        .btn { width: 100%; padding: 14px; background: #1b3022; color: #d4af37; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 5px; border: 1px solid #d4af37; }
        .btn-gasto { background: #8b3a3a; color: white; border-color: #a04040; }
        
        .card-pedido { background: #fff; border: 2px solid #d4af37; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card-pedido h3 { color: #1b3022; font-size: 16px; margin-bottom: 6px; border-bottom: 1px solid #eee; padding-bottom: 4px; display: flex; justify-content: space-between; }
        .card-pedido p { font-size: 13px; color: #444; margin-bottom: 4px; }
        .btn-concluir { background: #2c4c32; color: #d4af37; border: none; padding: 10px 12px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 10px; width: 100%; }

        .qr-box { text-align: center; background: #fff; padding: 15px; border-radius: 12px; border: 1px dashed #d4af37; }
        .qr-box img { max-width: 160px; height: auto; margin: 10px 0; border: 3px solid #fdfbf7; }
        .qr-link { font-size: 11px; color: #1b3022; word-break: break-all; background: #f4edd3; padding: 6px; border-radius: 6px; display: inline-block; margin-top: 6px; font-weight: 600; }

        .loading { display: none; text-align: center; font-weight: bold; color: #d4af37; margin-top: 10px; background: #1b3022; padding: 10px; border-radius: 8px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>🥤 EMUNÁH PDV</h1>
            <div class="subtitle">Painel de Controle e Atendimento</div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="mudarAba('venda')">Venda Balcão</div>
            <div class="tab" onclick="mudarAba('pedidos')">🔔 Pedidos</div>
            <div class="tab" onclick="mudarAba('gasto')">Gastos</div>
            <div class="tab" onclick="mudarAba('qrcode')">QR Cardápio</div>
        </div>

        <!-- Venda Balcão -->
        <div id="secao-venda">
            <div class="form-group">
                <label>Selecionar Produto:</label>
                <select id="produto">
                    <option value="Garapa Natural 500ml" data-preco="7.00" data-custo="2.20">Garapa Natural 500ml - R$ 7,00</option>
                    <option value="Garapa Natural 1L" data-preco="12.00" data-custo="4.00">Garapa Natural 1 Litro - R$ 12,00</option>
                    <option value="Garapa com Limão" data-preco="8.00" data-custo="2.50">Garapa com Limão - R$ 8,00</option>
                    <option value="Garapa com Abacaxi" data-preco="9.00" data-custo="3.00">Garapa com Abacaxi - R$ 9,00</option>
                    <option value="Garapa com Morango" data-preco="10.00" data-custo="3.50">Garapa com Morango - R$ 10,00</option>
                    <option value="Garapa com Maracujá" data-preco="10.00" data-custo="3.50">Garapa com Maracujá - R$ 10,00</option>
                    <option value="Pastel" data-preco="8.00" data-custo="3.20">Pastel - R$ 8,00</option>
                    <option value="Pamonha" data-preco="10.00" data-custo="4.50">Pamonha - R$ 10,00</option>
                    <option value="Água de Côco" data-preco="6.00" data-custo="2.50">Água de Côco - R$ 6,00</option>
                    <option value="Água Mineral" data-preco="4.00" data-custo="1.80">Água Mineral - R$ 4,00</option>
                    <option value="Refrigerante" data-preco="6.00" data-custo="3.00">Refrigerante - R$ 6,00</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quantidade:</label>
                <input type="number" id="qtd" value="1" min="1">
            </div>

            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="pagamentoVenda">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <button class="btn" onclick="enviarVenda()">REGISTRAR VENDA</button>
        </div>

        <!-- Tela de Pedidos dos Clientes -->
        <div id="secao-pedidos" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 14px; color: #1b3022;">Pedidos Chegando:</h3>
                <button onclick="carregarPedidos()" style="background: #d4af37; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">🔄 Atualizar</button>
            </div>
            <div id="listaPedidosBalcao">
                <p style="text-align: center; color: #666; font-size: 13px; padding: 20px;">Clique em atualizar para ver os pedidos.</p>
            </div>
        </div>

        <!-- Lançar Gasto -->
        <div id="secao-gasto" style="display: none;">
            <div class="form-group">
                <label>Categoria:</label>
                <select id="categoriaGasto">
                    <option value="Insumos">Insumos (Cana, Frutas, Copos)</option>
                    <option value="Gelo">Gelo</option>
                    <option value="Manutenção">Manutenção / Equipamentos</option>
                    <option value="Despesas Fixas">Aluguel / Água / Luz</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <div class="form-group">
                <label>Descrição:</label>
                <input type="text" id="descricaoGasto" placeholder="Ex: Compra de gelo">
            </div>
            <div class="form-group">
                <label>Valor (R$):</label>
                <input type="number" id="valorGasto" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="pagamentoGasto">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>
            <div class="form-group">
                <label>Comprovante (Foto):</label>
                <input type="file" id="fotoComprovante" accept="image/*" capture="camera">
            </div>
            <button class="btn btn-gasto" onclick="enviarGasto()">REGISTRAR GASTO</button>
        </div>

        <!-- QR Code -->
        <div id="secao-qrcode" style="display: none; text-align: center;">
            <p style="font-size: 12px; color: #1b3022; margin-bottom: 8px; font-weight: 600;">QR Code do Cardápio Digital:</p>
            <div class="qr-box">
                <div id="qrCodeContainer"></div>
                <div class="qr-link" id="linkCardapioTexto"></div>
            </div>
            <button class="btn" style="margin-top: 12px; background: #b8860b;" onclick="copiarLinkCardapio()">Copiar Link</button>
        </div>

        <div id="loading" class="loading">Processando... Aguarde.</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwethJCpjNczjP0JJzYcdEwOVOCNgwN-Jnb9tLitb26_Cx4_RegzPEqyEtffytbBXFj_Q/exec";

        const urlCardapio = window.location.href.replace('index.html', '').replace(/[\/]+$/, '') + '/cardapio.html';
        document.getElementById('linkCardapioTexto').innerText = urlCardapio;
        try {
            var qr = qrcode(0, 'M');
            qr.addData(urlCardapio);
            qr.make();
            document.getElementById('qrCodeContainer').innerHTML = qr.createImgTag(4, 5);
        } catch(e) {}

        function copiarLinkCardapio() {
            navigator.clipboard.writeText(urlCardapio);
            alert("Link copiado!");
        }

        function mudarAba(aba) {
            document.getElementById('secao-venda').style.display = (aba === 'venda') ? 'block' : 'none';
            document.getElementById('secao-pedidos').style.display = (aba === 'pedidos') ? 'block' : 'none';
            document.getElementById('secao-gasto').style.display = (aba === 'gasto') ? 'block' : 'none';
            document.getElementById('secao-qrcode').style.display = (aba === 'qrcode') ? 'block' : 'none';
            
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach((t, i) => {
                t.classList.toggle('active', (i === 0 && aba === 'venda') || (i === 1 && aba === 'pedidos') || (i === 2 && aba === 'gasto') || (i === 3 && aba === 'qrcode'));
            });

            if(aba === 'pedidos') {
                carregarPedidos();
            }
        }

        async function carregarPedidos() {
            const container = document.getElementById('listaPedidosBalcao');
            container.innerHTML = '<p style="text-align: center; color: #666; padding: 15px;">Buscando pedidos...</p>';
            
            try {
                const res = await fetch(URL_APPS_SCRIPT);
                const pedidos = await res.json();
                
                container.innerHTML = "";
                if (!pedidos || pedidos.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666; padding: 15px;">Nenhum pedido pendente.</p>';
                    return;
                }

                pedidos.reverse().forEach((p, index) => {
                    const card = document.createElement('div');
                    card.className = 'card-pedido';
                    card.innerHTML = `
                        <h3><span>📋 Pedido</span> <span style="font-size: 12px; color: #b8860b;">R$ ${Number(p.total).toFixed(2).replace('.', ',')}</span></h3>
                        <p><strong>Item:</strong> ${p.produto}</p>
                        <p><strong>Qtd:</strong> ${p.qtd} | <strong>Pagamento:</strong> ${p.pagamento}</p>
                        <p style="font-size: 11px; color: #886; margin-top: 4px;">Horário: ${new Date(p.dataHora).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                        <button class="btn-concluir" onclick='concluirEBaixarEstoque(${JSON.stringify(p)}, this)'>✔️ Concluir / Baixar no Caixa e Estoque</button>
                    `;
                    container.appendChild(card);
                });
            } catch(e) {
                container.innerHTML = '<p style="text-align: center; color: #8b3a3a; padding: 15px;">Erro ao carregar pedidos.</p>';
            }
        }

        async function concluirEBaixarEstoque(pedido, botaoElemento) {
            if (!confirm(`Confirmar conclusão do pedido de ${pedido.produto} (Qtd: ${pedido.qtd})? Isso atualizará o caixa e o estoque.`)) {
                return;
            }

            botaoElemento.innerText = "Processando baixa...";
            botaoElemento.disabled = true;

            const dados = {
                acao: "concluir_pedido",
                pagamento: pedido.pagamento,
                itens: [
                    {
                        nome: pedido.produto,
                        qtd: pedido.qtd,
                        preco: Number(pedido.total) / Number(pedido.qtd),
                        custo: 2.00 // Custo base estimado ou ajustável
                    }
                ]
            };

            try {
                await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dados)
                });

                alert("Pedido concluído! Caixa atualizado e estoque baixado com sucesso.");
                botaoElemento.parentElement.remove(); // Remove o card da tela
            } catch (e) {
                alert("Erro ao processar baixa: " + e);
                botaoElemento.innerText = "✔️ Concluir / Baixar no Caixa e Estoque";
                botaoElemento.disabled = false;
            }
        }

        async function enviarVenda() {
            const selectProd = document.getElementById('produto');
            const option = selectProd.options[selectProd.selectedIndex];
            const dados = {
                acao: "venda",
                produto: option.value,
                qtd: document.getElementById('qtd').value,
                valorUnitario: option.getAttribute('data-preco'),
                custoUnitario: option.getAttribute('data-custo'),
                formaPagamento: document.getElementById('pagamentoVenda').value
            };
            mostrarCarregamento(true);
            try {
                await fetch(URL_APPS_SCRIPT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dados) });
                alert("Venda registrada e estoque baixado com sucesso!");
                document.getElementById('qtd').value = "1";
            } catch (e) {
                alert("Erro de conexão.");
            } finally {
                mostrarCarregamento(false);
            }
        }

        async function enviarGasto() {
            const fileInput = document.getElementById('fotoComprovante');
            let base64File = "", nomeArquivo = "";
            mostrarCarregamento(true);
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                nomeArquivo = `gasto_${new Date().getTime()}.jpg`;
                base64File = await comprimirEConverterBase64(file);
            }
            const dados = {
                acao: "gasto",
                categoria: document.getElementById('categoriaGasto').value,
                descricao: document.getElementById('descricaoGasto').value,
                valor: document.getElementById('valorGasto').value,
                formaPagamento: document.getElementById('pagamentoGasto').value,
                arquivoBase64: base64File,
                nomeArquivo: nomeArquivo
            };
            try {
                await fetch(URL_APPS_SCRIPT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dados) });
                alert("Gasto registrado!");
                document.getElementById('descricaoGasto').value = "";
                document.getElementById('valorGasto').value = "";
                fileInput.value = "";
            } catch (e) {
                alert("Erro de conexão.");
            } finally {
                mostrarCarregamento(false);
            }
        }

        function comprimirEConverterBase64(arquivo) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(arquivo);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let largura = img.width, altura = img.height;
                        const maximo = 800;
                        if (largura > maximo) { altura = (maximo / largura) * altura; largura = maximo; }
                        canvas.width = largura; canvas.height = altura;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, largura, altura);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }
    </script>
</body>
</html>
