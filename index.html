<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - Emunáh Garaparia</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #1b3022; padding: 10px; color: #333; }
        
        .container { max-width: 480px; margin: 0 auto; background: #fdfbf7; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 2px solid #d4af37; }
        
        h1 { text-align: center; color: #2c4c32; font-size: 20px; font-weight: bold; }
        .subtitle { text-align: center; color: #d4af37; font-size: 11px; margin-bottom: 12px; font-style: italic; }
        
        .tabs { display: flex; margin-bottom: 15px; border-radius: 6px; overflow: hidden; border: 1px solid #d4af37; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #2c4c32; background: #f4edd3; font-size: 14px; }
        .tab.active { background: #2c4c32; color: #d4af37; }

        /* Grade de Produtos Rápidos */
        .grid-produtos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
        .prod-card { background: #fff; border: 1px solid #d4af37; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .prod-card:active { background: #f4edd3; transform: scale(0.97); }
        .prod-card.selected { background: #2c4c32; color: white; border-color: #1b3022; }
        .prod-card.selected .prod-preco { color: #d4af37; }
        .prod-nome { font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #2c4c32; }
        .prod-card.selected .prod-nome { color: #fff; }
        .prod-preco { font-size: 13px; color: #b8860b; font-weight: bold; }

        /* Controles de Quantidade */
        .painel-selecao { background: #f4edd3; padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #d4af37; display: flex; align-items: center; justify-content: space-between; }
        .info-selecionado { font-size: 13px; font-weight: bold; color: #2c4c32; }
        .controle-qtd { display: flex; align-items: center; gap: 8px; }
        .btn-qtd { width: 32px; height: 32px; background: #2c4c32; color: #d4af37; border: none; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .qtd-valor { font-size: 16px; font-weight: bold; min-width: 20px; text-align: center; }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #2c4c32; font-size: 13px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #d4af37; border-radius: 6px; font-size: 14px; background: #fff; }

        .btn { width: 100%; padding: 12px; background: #2c4c32; color: #d4af37; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; border: 1px solid #d4af37; }
        .btn:active { background: #1b3022; }
        .btn-gasto { background: #8b3a3a; color: white; }
        
        .loading { display: none; text-align: center; font-weight: bold; color: #d4af37; margin-top: 10px; background: #2c4c32; padding: 8px; border-radius: 6px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🥤 EMUNÁH GARAPARIA</h1>
        <div class="subtitle">"Que o Senhor nosso Deus nos abençoe e faça prosperar o trabalho de nossas mãos."</div>

        <!-- Abas de Navegação -->
        <div class="tabs">
            <div class="tab active" onclick="mudarAba('venda')">Nova Venda</div>
            <div class="tab" onclick="mudarAba('gasto')">Lançar Gasto</div>
        </div>

        <!-- Formulário de Vendas -->
        <div id="secao-venda">
            <label>Selecione o Item (Toque rápido):</label>
            <div class="grid-produtos" id="gradeProdutos">
                <!-- Preenchido via JavaScript -->
            </div>

            <!-- Item Selecionado e Quantidade -->
            <div class="painel-selecao">
                <div>
                    <div style="font-size: 11px; color: #666;">Selecionado:</div>
                    <div class="info-selecionado" id="labelProdutoSelecionado">Nenhum</div>
                </div>
                <div class="controle-qtd">
                    <button class="btn-qtd" onclick="alterarQtd(-1)">-</button>
                    <span class="qtd-valor" id="qtdVisual">1</span>
                    <button class="btn-qtd" onclick="alterarQtd(1)">+</button>
                </div>
            </div>

            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="pagamentoVenda">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <button class="btn" onclick="enviarVenda()">REGISTRAR VENDA</button>
        </div>

        <!-- Formulário de Gastos -->
        <div id="secao-gasto" style="display: none;">
            <div class="form-group">
                <label>Categoria do Gasto:</label>
                <select id="categoriaGasto">
                    <option value="Insumos">Insumos (Cana, Limão, Frutas, Copos)</option>
                    <option value="Gelo">Gelo</option>
                    <option value="Manutenção">Manutenção / Equipamentos</option>
                    <option value="Despesas Fixas">Aluguel / Água / Luz</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="form-group">
                <label>Descrição:</label>
                <input type="text" id="descricaoGasto" placeholder="Ex: Compra de 3 sacos de gelo">
            </div>

            <div class="form-group">
                <label>Valor (R$):</label>
                <input type="number" id="valorGasto" step="0.01" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="pagamentoGasto">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <div class="form-group">
                <label>Comprovante (Foto):</label>
                <input type="file" id="fotoComprovante" accept="image/*" capture="camera">
            </div>

            <button class="btn btn-gasto" onclick="enviarGasto()">REGISTRAR GASTO</button>
        </div>

        <div id="loading" class="loading">Salvando na planilha... Aguarde.</div>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwethJCpjNczjP0JJzYcdEwOVOCNgwN-Jnb9tLitb26_Cx4_RegzPEqyEtffytbBXFj_Q/exec";

        // Lista oficial do cardápio da Emunáh
        const produtosCatalogo = [
            { nome: "Garapa Natural 500ml", preco: 7.00, custo: 2.20 },
            { nome: "Garapa Natural 1L", preco: 12.00, custo: 4.00 },
            { nome: "Garapa com Limão", preco: 8.00, custo: 2.50 },
            { nome: "Garapa com Abacaxi", preco: 9.00, custo: 3.00 },
            { nome: "Garapa com Morango", preco: 10.00, custo: 3.50 },
            { nome: "Garapa com Maracujá", preco: 10.00, custo: 3.50 },
            { nome: "Adicional Hortelã/Gengibre", preco: 2.00, custo: 0.50 },
            { nome: "Pastel", preco: 8.00, custo: 3.20 },
            { nome: "Pamonha", preco: 10.00, custo: 4.50 },
            { nome: "Água de Coco", preco: 6.00, custo: 2.50 },
            { nome: "Água Mineral", preco: 4.00, custo: 1.80 },
            { nome: "Refrigerante", preco: 6.00, custo: 3.00 }
        ];

        let produtoSelecionado = null;
        let quantidadeAtual = 1;

        // Inicializa a grade de produtos na tela
        function carregarGradeProdutos() {
            const grade = document.getElementById('gradeProdutos');
            grade.innerHTML = "";

            produtosCatalogo.forEach((prod, index) => {
                const card = document.createElement('div');
                card.className = `prod-card ${produtoSelecionado === index ? 'selected' : ''}`;
                card.onclick = () => selecionarProduto(index);
                card.innerHTML = `
                    <div class="prod-nome">${prod.nome}</div>
                    <div class="prod-preco">R$ ${prod.preco.toFixed(2).replace('.', ',')}</div>
                `;
                grade.appendChild(card);
            });
        }

        function selecionarProduto(index) {
            produtoSelecionado = index;
            quantidadeAtual = 1;
            document.getElementById('qtdVisual').innerText = quantidadeAtual;
            
            const prod = produtosCatalogo[index];
            document.getElementById('labelProdutoSelecionado').innerText = `${prod.nome} (R$ ${prod.preco.toFixed(2).replace('.', ',')})`;
            carregarGradeProdutos();
        }

        function alterarQtd(delta) {
            quantidadeAtual += delta;
            if (quantidadeAtual < 1) quantidadeAtual = 1;
            document.getElementById('qtdVisual').innerText = quantidadeAtual;
        }

        function mudarAba(aba) {
            const secVenda = document.getElementById('secao-venda');
            const secGasto = document.getElementById('secao-gasto');
            const tabs = document.querySelectorAll('.tab');

            tabs.forEach(t => t.classList.remove('active'));

            if (aba === 'venda') {
                secVenda.style.display = 'block';
                secGasto.style.display = 'none';
                tabs[0].classList.add('active');
            } else {
                secVenda.style.display = 'none';
                secGasto.style.display = 'block';
                tabs[1].classList.add('active');
            }
        }

        function mostrarCarregamento(ativo) {
            document.getElementById('loading').style.display = ativo ? 'block' : 'none';
        }

        async function enviarVenda() {
            if (produtoSelecionado === null) {
                alert("Por favor, selecione um produto na grade antes de registrar a venda!");
                return;
            }

            const prod = produtosCatalogo[produtoSelecionado];
            
            const dados = {
                acao: "venda",
                produto: prod.nome,
                qtd: quantidadeAtual,
                valorUnitario: prod.preco,
                custoUnitario: prod.custo,
                formaPagamento: document.getElementById('pagamentoVenda').value
            };

            mostrarCarregamento(true);

            try {
                const resposta = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(dados)
                });
                const resultado = await resposta.json();
                
                if (resultado.status === "sucesso") {
                    alert("Venda registrada com sucesso!");
                    // Reseta seleção
                    produtoSelecionado = null;
                    quantidadeAtual = 1;
                    document.getElementById('qtdVisual').innerText = "1";
                    document.getElementById('labelProdutoSelecionado').innerText = "Nenhum";
                    carregarGradeProdutos();
                } else {
                    alert("Erro ao registrar: " + resultado.mensagem);
                }
            } catch (e) {
                alert("Erro de conexão: " + e);
            } finally {
                mostrarCarregamento(false);
            }
        }

        async function enviarGasto() {
            const fileInput = document.getElementById('fotoComprovante');
            let base64File = "";
            let nomeArquivo = "";

            mostrarCarregamento(true);

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                nomeArquivo = `gasto_${new Date().getTime()}.jpg`;
                base64File = await comprimirEConverterBase64(file);
            }

            const dados = {
                acao: "gasto",
                categoria: document.getElementById('categoriaGasto').value,
                descricao: document.getElementById('descricaoGasto').value,
                valor: document.getElementById('valorGasto').value,
                formaPagamento: document.getElementById('pagamentoGasto').value,
                arquivoBase64: base64File,
                nomeArquivo: nomeArquivo
            };

            try {
                const resposta = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(dados)
                });
                const resultado = await resposta.json();
                
                if (resultado.status === "sucesso") {
                    alert("Gasto registrado com sucesso!");
                    document.getElementById('descricaoGasto').value = "";
                    document.getElementById('valorGasto').value = "";
                    fileInput.value = "";
                } else {
                    alert("Erro ao registrar: " + resultado.mensagem);
                }
            } catch (e) {
                alert("Erro de conexão: " + e);
            } finally {
                mostrarCarregamento(false);
            }
        }

        function comprimirEConverterBase64(arquivo) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(arquivo);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let largura = img.width;
                        let altura = img.height;
                        const maximo = 800;

                        if (largura > maximo) {
                            altura = (maximo / largura) * altura;
                            largura = maximo;
                        }

                        canvas.width = largura;
                        canvas.height = altura;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, largura, altura);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        // Executa ao carregar a página
        window.onload = () => {
            carregarGradeProdutos();
        };
    </script>
</body>
</html>
