<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - Garaparia</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f9; padding: 15px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 15px; font-size: 22px; }
        
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .tabs { display: flex; margin-bottom: 15px; border-bottom: 2px solid #ddd; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; color: #7f8c8d; background: #ecf0f1; }
        .tab.active { background: #27ae60; color: white; border-bottom: 2px solid #27ae60; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }

        .btn { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:active { background: #219653; }
        
        .loading { display: none; text-align: center; font-weight: bold; color: #e67e22; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🥤 Garaparia PDV</h1>

        <!-- Abas de Navegação -->
        <div class="tabs">
            <div class="tab active" onclick="mudarAba('venda')">Nova Venda</div>
            <div class="tab" onclick="mudarAba('gasto')">Lançar Gasto</div>
        </div>

        <!-- Formulário de Vendas -->
        <div id="secao-venda">
            <div class="form-group">
                <label>Produto:</label>
                <select id="produto">
                    <option value="Garapa 300ml" data-preco="5.00" data-custo="1.50">Garapa 300ml - R$ 5,00</option>
                    <option value="Garapa 500ml" data-preco="7.00" data-custo="2.20">Garapa 500ml - R$ 7,00</option>
                    <option value="Garapa 1 Litro" data-preco="12.00" data-custo="4.00">Garapa 1 Litro - R$ 12,00</option>
                    <option value="Pastel de Carne" data-preco="8.00" data-custo="3.20">Pastel de Carne - R$ 8,00</option>
                    <option value="Pastel de Queijo" data-preco="8.00" data-custo="3.00">Pastel de Queijo - R$ 8,00</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quantidade:</label>
                <input type="number" id="qtd" value="1" min="1">
            </div>

            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="pagamentoVenda">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <button class="btn" onclick="enviarVenda()">REGISTRAR VENDA</button>
        </div>

        <!-- Formulário de Gastos -->
        <div id="secao-gasto" style="display: none;">
            <div class="form-group">
                <label>Categoria do Gasto:</label>
                <select id="categoriaGasto">
                    <option value="Insumos">Insumos (Cana, Limão, Copos)</option>
                    <option value="Gelo">Gelo</option>
                    <option value="Manutenção">Manutenção / Equipamentos</option>
                    <option value="Despesas Fixas">Aluguel / Água / Luz</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="form-group">
                <label>Descrição:</label>
                <input type="text" id="descricaoGasto" placeholder="Ex: Compra de 3 sacos de gelo">
            </div>

            <div class="form-group">
                <label>Valor (R$):</label>
                <input type="number" id="valorGasto" step="0.01" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="pagamentoGasto">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <div class="form-group">
                <label>Comprovante (Foto):</label>
                <input type="file" id="fotoComprovante" accept="image/*" capture="camera">
            </div>

            <button class="btn" style="background: #e74c3c;" onclick="enviarGasto()">REGISTRAR GASTO</button>
        </div>

        <div id="loading" class="loading">Salvando na planilha... Aguarde.</div>
    </div>

    <script>
        // URL DO SEU GOOGLE APPS SCRIPT JÁ CONFIGURADA
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwethJCpjNczjP0JJzYcdEwOVOCNgwN-Jnb9tLitb26_Cx4_RegzPEqyEtffytbBXFj_Q/exec";

        function mudarAba(aba) {
            const secVenda = document.getElementById('secao-venda');
            const secGasto = document.getElementById('secao-gasto');
            const tabs = document.querySelectorAll('.tab');

            tabs.forEach(t => t.classList.remove('active'));

            if (aba === 'venda') {
                secVenda.style.display = 'block';
                secGasto.style.display = 'none';
                tabs[0].classList.add('active');
            } else {
                secVenda.style.display = 'none';
                secGasto.style.display = 'block';
                tabs[1].classList.add('active');
            }
        }

        function mostrarCarregamento(ativo) {
            document.getElementById('loading').style.display = ativo ? 'block' : 'none';
        }

        // Enviar Venda
        async function enviarVenda() {
            const selectProd = document.getElementById('produto');
            const option = selectProd.options[selectProd.selectedIndex];
            
            const dados = {
                acao: "venda",
                produto: option.value,
                qtd: document.getElementById('qtd').value,
                valorUnitario: option.getAttribute('data-preco'),
                custoUnitario: option.getAttribute('data-custo'),
                formaPagamento: document.getElementById('pagamentoVenda').value
            };

            mostrarCarregamento(true);

            try {
                const resposta = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(dados)
                });
                const resultado = await resposta.json();
                
                if (resultado.status === "sucesso") {
                    alert("Venda registrada com sucesso!");
                    document.getElementById('qtd').value = "1";
                } else {
                    alert("Erro ao registrar: " + resultado.mensagem);
                }
            } catch (e) {
                alert("Erro de conexão: " + e);
            } finally {
                mostrarCarregamento(false);
            }
        }

        // Enviar Gasto (Com conversão e compactação da foto em Base64)
        async function enviarGasto() {
            const fileInput = document.getElementById('fotoComprovante');
            let base64File = "";
            let nomeArquivo = "";

            mostrarCarregamento(true);

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                nomeArquivo = `gasto_${new Date().getTime()}.jpg`;
                base64File = await comprimirEConverterBase64(file);
            }

            const dados = {
                acao: "gasto",
                categoria: document.getElementById('categoriaGasto').value,
                descricao: document.getElementById('descricaoGasto').value,
                valor: document.getElementById('valorGasto').value,
                formaPagamento: document.getElementById('pagamentoGasto').value,
                arquivoBase64: base64File,
                nomeArquivo: nomeArquivo
            };

            try {
                const resposta = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(dados)
                });
                const resultado = await resposta.json();
                
                if (resultado.status === "sucesso") {
                    alert("Gasto registrado com sucesso!");
                    document.getElementById('descricaoGasto').value = "";
                    document.getElementById('valorGasto').value = "";
                    fileInput.value = "";
                } else {
                    alert("Erro ao registrar: " + resultado.mensagem);
                }
            } catch (e) {
                alert("Erro de conexão: " + e);
            } finally {
                mostrarCarregamento(false);
            }
        }

        // Função para compactar imagem antes de enviar (economiza espaço no Google Drive)
        function comprimirEConverterBase64(arquivo) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(arquivo);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let largura = img.width;
                        let altura = img.height;
                        const maximo = 800;

                        if (largura > maximo) {
                            altura = (maximo / largura) * altura;
                            largura = maximo;
                        }

                        canvas.width = largura;
                        canvas.height = altura;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, largura, altura);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }
    </script>
</body>
</html>
