<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital - Emunáh Garaparia</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #15251a; padding-bottom: 110px; color: #fdfbf7; }
        
        /* Cabeçalho Estilo Mini Site / Bio */
        .header { background: linear-gradient(135deg, #1b3022 0%, #101e14 100%); color: #d4af37; text-align: center; padding: 35px 20px 25px 20px; border-bottom: 2px solid #d4af37; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .header h1 { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
        .header p { font-size: 13px; font-style: italic; color: #e8e2cd; max-width: 400px; margin: 0 auto; line-height: 1.4; }

        /* Categorias em Estilo de Pílulas / Botões Modernos */
        .categorias-wrapper { background: #1b3022; padding: 12px 10px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(212,175,55,0.3); backdrop-filter: blur(10px); }
        .categorias { display: flex; overflow-x: auto; gap: 10px; max-width: 500px; margin: 0 auto; scrollbar-width: none; }
        .cat-btn { background: #26422f; color: #fdfbf7; border: 1px solid #d4af37; padding: 9px 20px; border-radius: 25px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: all 0.3s ease; }
        .cat-btn.active { background: #d4af37; color: #15251a; box-shadow: 0 0 12px rgba(212,175,55,0.5); transform: translateY(-1px); }

        /* Lista de Produtos */
        .container { padding: 20px 15px; max-width: 500px; margin: 0 auto; }
        
        .secao-titulo { font-size: 16px; color: #d4af37; margin: 20px 0 12px 0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-left: 3px solid #d4af37; padding-left: 8px; }

        .card-produto { background: #1f3827; border: 1.5px solid rgba(212,175,55,0.4); border-radius: 14px; padding: 16px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 15px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .card-produto:hover { border-color: #d4af37; transform: translateY(-2px); }
        
        .prod-info h3 { font-size: 16px; color: #fdfbf7; font-weight: 700; margin-bottom: 4px; }
        .prod-info p { font-size: 15px; color: #d4af37; font-weight: 800; }
        
        .acoes-qtd { display: flex; align-items: center; gap: 8px; background: #15251a; padding: 4px 8px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3); }
        .btn-add { background: #d4af37; color: #15251a; border: none; width: 32px; height: 32px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-add:active { transform: scale(0.9); }
        .btn-menos { background: #8b3a3a; color: #fff; }
        .qtd-texto { font-weight: 800; font-size: 16px; color: #fdfbf7; min-width: 20px; text-align: center; }

        .btn-adicionar-simples { background: #d4af37; color: #15251a; border: none; padding: 9px 16px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; }

        /* Barra Fixa do Carrinho (Rodapé) */
        .bar-carrinho { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(27, 48, 34, 0.95); backdrop-filter: blur(12px); border-top: 2px solid #d4af37; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; max-width: 500px; margin: 0 auto; box-shadow: 0 -6px 25px rgba(0,0,0,0.6); z-index: 100; }
        .total-carrinho { font-size: 18px; font-weight: 800; color: #d4af37; }
        .btn-finalizar { background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%); color: #15251a; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(212,175,55,0.4); }
        
        /* Modal de Confirmação */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .modal-content { background: #1f3827; border: 2px solid #d4af37; padding: 25px; border-radius: 18px; max-width: 400px; width: 100%; box-shadow: 0 15px 40px rgba(0,0,0,0.7); color: #fdfbf7; }
        .modal-content h2 { color: #d4af37; margin-bottom: 15px; font-size: 20px; text-align: center; }
        .modal-content label { display: block; font-size: 13px; font-weight: 700; color: #e8e2cd; margin-bottom: 6px; text-transform: uppercase; }
        .modal-content input, .modal-content select { width: 100%; padding: 13px; margin-bottom: 18px; border: 1.5px solid #d4af37; border-radius: 10px; font-size: 15px; background: #15251a; color: #fdfbf7; outline: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🥤 EMUNÁH GARAPARIA</h1>
        <p>"Que o Senhor nosso Deus nos abençoe e faça prosperar o trabalho de nossas mãos." (Salmos 90:17)</p>
    </div>

    <div class="categorias-wrapper">
        <div class="categorias" id="categorias"></div>
    </div>

    <div class="container" id="listaProdutos"></div>

    <div class="bar-carrinho" id="barraCarrinho" style="display: none;">
        <div>
            <div style="font-size: 11px; color: #e8e2cd; font-weight: 600;">Total do Pedido:</div>
            <div class="total-carrinho" id="totalVisual">R$ 0,00</div>
        </div>
        <button class="btn-finalizar" onclick="abrirModal()">ENVIAR PEDIDO 🚀</button>
    </div>

    <div class="modal" id="modalPedido">
        <div class="modal-content">
            <h2>Finalizar Pedido</h2>
            <label>Seu Nome ou Número da Mesa:</label>
            <input type="text" id="nomeCliente" placeholder="Ex: João / Mesa 04">
            
            <label>Forma de Pagamento:</label>
            <select id="pagamentoCliente">
                <option value="PIX">PIX</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão">Cartão</option>
            </select>

            <button class="btn-finalizar" style="width: 100%; text-align: center;" onclick="confirmarEnviarPedido()">CONFIRMAR E ENVIAR</button>
            <button onclick="fecharModal()" style="width: 100%; margin-top: 12px; background: transparent; border: none; color: #aaa; cursor: pointer; font-weight: 600; font-size: 14px;">Voltar ao Cardápio</button>
        </div>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwethJCpjNczjP0JJzYcdEwOVOCNgwN-Jnb9tLitb26_Cx4_RegzPEqyEtffytbBXFj_Q/exec";
        let produtos = [];
        let carrinho = [];
        let categoriaAtual = "todas";

        const moeda = valor => Number(valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const escapar = valor => String(valor ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

        async function carregarProdutos() {
            const container = document.getElementById("listaProdutos");
            container.innerHTML = '<p style="text-align:center;color:#e8e2cd;padding:24px">Carregando cardápio...</p>';
            try {
                const resp = await fetch(URL_APPS_SCRIPT + "?acao=listarProdutos&publico=1", { method: "GET", redirect: "follow" });
                if (!resp.ok) throw new Error("Não foi possível consultar o catálogo.");
                const json = await resp.json();
                if (!json.sucesso) throw new Error(json.mensagem || "Erro ao carregar produtos.");
                produtos = Array.isArray(json.dados) ? json.dados.filter(p => p.ativo === true) : [];
                renderizarCategorias();
                renderizarProdutos("todas");
            } catch (erro) {
                container.innerHTML = `<p style="text-align:center;color:#ffd6d6;padding:24px">${escapar(erro.message)}<br>Atualize a página ou tente novamente mais tarde.</p>`;
            }
        }

        function renderizarCategorias() {
            const categorias = [...new Set(produtos.map(p => String(p.categoria || "Outros").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
            const el = document.getElementById("categorias");
            el.innerHTML = `<button class="cat-btn ${categoriaAtual === 'todas' ? 'active' : ''}" onclick="filtrarCategoria('todas')">🌟 Todos</button>` +
                categorias.map(c => `<button class="cat-btn ${categoriaAtual === c ? 'active' : ''}" onclick="filtrarCategoria(decodeURIComponent('${encodeURIComponent(c)}'))">${escapar(c)}</button>`).join("");
        }

        function renderizarProdutos(categoria = "todas") {
            categoriaAtual = categoria;
            renderizarCategorias();
            const container = document.getElementById("listaProdutos");
            container.innerHTML = "";
            const filtrados = categoria === "todas" ? produtos : produtos.filter(p => String(p.categoria || "Outros").trim() === categoria);
            if (!filtrados.length) {
                container.innerHTML = '<p style="text-align:center;color:#e8e2cd;padding:24px">Nenhum produto disponível nesta categoria.</p>';
                atualizarTotal(); return;
            }
            filtrados.forEach(p => {
                const item = carrinho.find(c => c.produto_id === p.produto_id);
                const qtd = item ? item.qtd : 0;
                const card = document.createElement("div");
                card.className = "card-produto";
                card.innerHTML = `<div class="prod-info"><h3>${escapar(p.nome)}</h3><p>${moeda(p.preco_venda)}</p></div><div>${qtd > 0 ? `<div class="acoes-qtd"><button onclick="alterarQtd('${escapar(p.produto_id)}',-1)" class="btn-add btn-menos">-</button><span class="qtd-texto">${qtd}</span><button onclick="alterarQtd('${escapar(p.produto_id)}',1)" class="btn-add">+</button></div>` : `<button onclick="alterarQtd('${escapar(p.produto_id)}',1)" class="btn-adicionar-simples">+ Adicionar</button>`}</div>`;
                container.appendChild(card);
            });
            atualizarTotal();
        }

        function alterarQtd(id, delta) {
            const p = produtos.find(x => String(x.produto_id) === String(id));
            if (!p) return;
            let item = carrinho.find(c => String(c.produto_id) === String(id));
            if (!item && delta > 0) carrinho.push({ produto_id: p.produto_id, nome: p.nome, preco: Number(p.preco_venda), qtd: 1 });
            else if (item) { item.qtd += delta; if (item.qtd <= 0) carrinho = carrinho.filter(c => String(c.produto_id) !== String(id)); }
            renderizarProdutos(categoriaAtual);
        }

        function atualizarTotal() {
            const total = carrinho.reduce((s, p) => s + Number(p.preco) * p.qtd, 0);
            document.getElementById("totalVisual").innerText = moeda(total);
            document.getElementById("barraCarrinho").style.display = carrinho.length ? "flex" : "none";
        }
        function abrirModal() { document.getElementById("modalPedido").style.display = "flex"; }
        function fecharModal() { document.getElementById("modalPedido").style.display = "none"; }

        async function confirmarEnviarPedido() {
            const nome = document.getElementById("nomeCliente").value.trim();
            if (!nome) { alert("Por favor, digite seu nome ou número da mesa."); return; }
            if (!carrinho.length) { alert("Adicione pelo menos um produto."); return; }
            const botao = document.querySelector("#modalPedido button.btn-finalizar");
            if (botao.disabled) return;
            botao.disabled = true; botao.textContent = "ENVIANDO...";
            const dados = {
                acao: "registrarPedidoQR",
                pedido_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("QR-" + Date.now() + "-" + Math.random().toString(16).slice(2)),
                cliente: nome,
                formaPagamento: document.getElementById("pagamentoCliente").value,
                itens: carrinho.map(p => ({ produto_id: p.produto_id, quantidade: p.qtd }))
            };
            try {
                const resp = await fetch(URL_APPS_SCRIPT, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(dados) });
                if (!resp.ok) throw new Error("Falha na comunicação com o servidor.");
                const json = await resp.json();
                if (!json.sucesso) throw new Error(json.mensagem || "Não foi possível registrar o pedido.");
                const id = json.dados && json.dados.pedido_id ? json.dados.pedido_id : dados.pedido_id;
                alert("Pedido " + id + " enviado ao balcão! Aguarde a confirmação do atendente. 🥤");
                carrinho = []; document.getElementById("nomeCliente").value = ""; fecharModal(); renderizarProdutos("todas");
            } catch (erro) { alert("Não foi possível confirmar o envio: " + erro.message + ". O pedido pode não ter sido registrado; consulte o atendente antes de tentar novamente."); }
            finally { botao.disabled = false; botao.textContent = "CONFIRMAR E ENVIAR"; }
        }

        function filtrarCategoria(cat) { renderizarProdutos(cat); }
        window.addEventListener("DOMContentLoaded", carregarProdutos);
    </script>
</body>
</html>
