<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa & Balcão - Emunáh Garaparia</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #1b3022; padding: 15px; color: #333; }
        
        .container { max-width: 500px; margin: 0 auto; background: #fdfbf7; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 2px solid #d4af37; }
        
        h1 { text-align: center; color: #2c4c32; font-size: 22px; font-weight: bold; }
        .subtitle { text-align: center; color: #d4af37; font-size: 12px; margin-bottom: 15px; font-style: italic; }
        
        .tabs { display: flex; margin-bottom: 20px; border-radius: 6px; overflow: hidden; border: 1px solid #d4af37; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; color: #2c4c32; background: #f4edd3; font-size: 14px; }
        .tab.active { background: #2c4c32; color: #d4af37; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #2c4c32; font-size: 13px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #d4af37; border-radius: 6px; font-size: 15px; background: #fff; }

        .btn { width: 100%; padding: 14px; background: #2c4c32; color: #d4af37; border: none; border-radius: 6px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; border: 1px solid #d4af37; }
        .btn:active { background: #1b3022; }
        .btn-gasto { background: #8b3a3a; color: white; }
        
        .loading { display: none; text-align: center; font-weight: bold; color: #d4af37; margin-top: 15px; background: #2c4c32; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🥤 PAINEL DO BALCÃO</h1>
        <div class="subtitle">Controle Interno - Emunáh Garaparia</div>

        <!-- Abas de Navegação Interna -->
        <div class="tabs">
            <div class="tab active" onclick="mudarAba('venda')">Venda Balcão</div>
            <div class="tab" onclick="mudarAba('gasto')">Lançar Gasto</div>
        </div>

        <!-- Formulário de Venda Direta no Balcão -->
        <div id="secao-venda">
            <div class="form-group">
                <label>Produto / Bebida:</label>
                <select id="produto">
                    <option value="Garapa Natural 500ml" data-preco="7.00" data-custo="2.20">Garapa Natural 500ml - R$ 7,00</option>
                    <option value="Garapa Natural 1L" data-preco="12.00" data-custo="4.00">Garapa Natural 1 Litro - R$ 12,00</option>
                    <option value="Garapa com Limão" data-preco="8.00" data-custo="2.50">Garapa com Limão - R$ 8,00</option>
                    <option value="Garapa com Abacaxi" data-preco="9.00" data-custo="3.00">Garapa com Abacaxi - R$ 9,00</option>
                    <option value="Garapa com Morango" data-preco="10.00" data-custo="3.50">Garapa com Morango - R$ 10,00</option>
                    <option value="Garapa com Maracujá" data-preco="10.00" data-custo="3.50">Garapa com Maracujá - R$ 10,00</option>
                    <option value="Pastel" data-preco="8.00" data-custo="3.20">Pastel - R$ 8,00</option>
                    <option value="Pamonha" data-preco="10.00" data-custo="4.50">Pamonha - R$ 10,00</option>
                    <option value="Água de Côco" data-preco="6.00" data-custo="2.50">Água de Côco - R$ 6,00</option>
                    <option value="Água Mineral" data-preco="4.00" data-custo="1.80">Água Mineral - R$ 4,00</option>
                    <option value="Refrigerante" data-preco="6.00" data-custo="3.00">Refrigerante - R$ 6,00</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quantidade:</label>
                <input type="number" id="qtd" value="1" min="1">
            </div>

            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="pagamentoVenda">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <button class="btn" onclick="enviarVenda()">REGISTRAR VENDA</button>
        </div>

        <!-- Formulário de Lançamento de Gastos -->
        <div id="secao-gasto" style="display: none;">
            <div class="form-group">
                <label>Categoria do Gasto:</label>
                <select id="categoriaGasto">
                    <option value="Insumos">Insumos (Cana, Limão, Frutas, Copos)</option>
                    <option value="Gelo">Gelo</option>
                    <option value="Manutenção">Manutenção / Equipamentos</option>
                    <option value="Despesas Fixas">Aluguel / Água / Luz</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="form-group">
                <label>Descrição:</label>
                <input type="text" id="descricaoGasto" placeholder="Ex: Compra de 3 sacos de gelo">
            </div>

            <div class="form-group">
                <label>Valor (R$):</label>
                <input type="number" id="valorGasto" step="0.01" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="pagamentoGasto">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <div class="form-group">
                <label>Comprovante (Foto):</label>
                <input type="file" id="fotoComprovante" accept="image/*" capture="camera">
            </div>

            <button class="btn btn-gasto" onclick="enviarGasto()">REGISTRAR GASTO</button>
        </div>

        <div id="loading" class="loading">Salvando na planilha... Aguarde.</div>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwethJCpjNczjP0JJzYcdEwOVOCNgwN-Jnb9tLitb26_Cx4_RegzPEqyEtffytbBXFj_Q/exec";

        function mudarAba(aba) {
            const secVenda = document.getElementById('secao-venda');
            const secGasto = document.getElementById('secao-gasto');
            const tabs = document.querySelectorAll('.tab');

            tabs.forEach(t => t.classList.remove('active'));

            if (aba === 'venda') {
                secVenda.style.display = 'block';
                secGasto.style.display = 'none';
                tabs[0].classList.add('active');
            } else {
                secVenda.style.display = 'none';
                secGasto.style.display = 'block';
                tabs[1].classList.add('active');
            }
        }

        function mostrarCarregamento(ativo) {
            document.getElementById('loading').style.display = ativo ? 'block' : 'none';
        }

        async function enviarVenda() {
            const selectProd = document.getElementById('produto');
            const option = selectProd.options[selectProd.selectedIndex];
            
            const dados = {
                acao: "venda",
                produto: option.value,
                qtd: document.getElementById('qtd').value,
                valorUnitario: option.getAttribute('data-preco'),
                custoUnitario: option.getAttribute('data-custo'),
                formaPagamento: document.getElementById('pagamentoVenda').value
            };

            mostrarCarregamento(true);

            try {
                const resposta = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(dados)
                });
                const resultado = await resposta.json();
                
                if (resultado.status === "sucesso") {
                    alert("Venda registrada com sucesso!");
                    document.getElementById('qtd').value = "1";
                } else {
                    alert("Erro ao registrar: " + resultado.mensagem);
                }
            } catch (e) {
                alert("Erro de conexão: " + e);
            } finally {
                mostrarCarregamento(false);
            }
        }

        async function enviarGasto() {
            const fileInput = document.getElementById('fotoComprovante');
            let base64File = "";
            let nomeArquivo = "";

            mostrarCarregamento(true);

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                nomeArquivo = `gasto_${new Date().getTime()}.jpg`;
                base64File = await comprimirEConverterBase64(file);
            }

            const dados = {
                acao: "gasto",
                categoria: document.getElementById('categoriaGasto').value,
                descricao: document.getElementById('descricaoGasto').value,
                valor: document.getElementById('valorGasto').value,
                formaPagamento: document.getElementById('pagamentoGasto').value,
                arquivoBase64: base64File,
                nomeArquivo: nomeArquivo
            };

            try {
                const resposta = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(dados)
                });
                const resultado = await resposta.json();
                
                if (resultado.status === "sucesso") {
                    alert("Gasto registrado com sucesso!");
                    document.getElementById('descricaoGasto').value = "";
                    document.getElementById('valorGasto').value = "";
                    fileInput.value = "";
                } else {
                    alert("Erro ao registrar: " + resultado.mensagem);
                }
            } catch (e) {
                alert("Erro de conexão: " + e);
            } finally {
                mostrarCarregamento(false);
            }
        }

        function comprimirEConverterBase64(arquivo) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(arquivo);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let largura = img.width;
                        let altura = img.height;
                        const maximo = 800;

                        if (largura > maximo) {
                            altura = (maximo / largura) * altura;
                            largura = maximo;
                        }

                        canvas.width = largura;
                        canvas.height = altura;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, largura, altura);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }
    </script>
</body>
</html>
